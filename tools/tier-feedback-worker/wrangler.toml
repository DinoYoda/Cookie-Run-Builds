name = "crk-tier-feedback"
main = "worker.js"
compatibility_date = "2024-08-01"

# Create KV and paste the id here:
#   npx wrangler kv namespace create TIER_FEEDBACK_KV
[[kv_namespaces]]
binding = "TIER_FEEDBACK_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Set the admin secret (do not commit the value):
#   npx wrangler secret put ADMIN_TOKEN
